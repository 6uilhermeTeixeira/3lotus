[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "3lotus-runner"
version = "0.1.0"
description = "Fail-closed MT5 runner for the 3lotus VPS"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
lotus-runner = "lotus_runner.main:main"
3lotus-runner = "lotus_runner.main:main"

[tool.setuptools]
packages = ["lotus_runner", "lotus_runner.strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8,<9"]
