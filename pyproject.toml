[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lotus-runner"
version = "0.1.0"
description = "Minimal, fail-closed MT5 strategy runner"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
lotus-runner = "lotus_runner.main:main"

[tool.setuptools]
packages = ["lotus_runner", "lotus_runner.strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
