name: Build Windows runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pytest
      - name: Test
        run: python -m pytest -q
      - name: Build runner
        run: pyinstaller --noconfirm --clean --name 2lotus-runner --onedir --paths . runner_entry.py
      - name: Smoke-test executable
        run: .\dist\2lotus-runner\2lotus-runner.exe --check
      - name: Assemble deployable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\2lotus-runner\strategies, package\2lotus-runner\mt5, package\2lotus-runner\scripts
          Copy-Item dist\2lotus-runner\* package\2lotus-runner -Recurse
          Copy-Item strategies\* package\2lotus-runner\strategies
          Copy-Item mt5\LotusRunnerBridge.mq5 package\2lotus-runner\mt5
          Copy-Item scripts\install.ps1 package\2lotus-runner\scripts
          Copy-Item README.md package\2lotus-runner
          Compress-Archive -Path package\2lotus-runner -DestinationPath package\2lotus-runner-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 2lotus-runner-windows-x64
          path: package/2lotus-runner-windows-x64.zip
          if-no-files-found: error
